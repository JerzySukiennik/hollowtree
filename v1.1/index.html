<!DOCTYPE html>
<!-- Hollowtree — co-op bee game. Entry point: importmap, canvas, loading overlay. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollowtree</title>
<style>
  :root { --honey: #f2b544; --amber: #d98324; --dark: #1b1408; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--dark); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f6e9cf; }
  canvas { display: block; width: 100%; height: 100%; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 45%, #3b2a10 0%, #140f06 70%);
    z-index: 10; transition: opacity .8s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h1 {
    font-size: clamp(38px, 7vw, 74px); font-weight: 300; letter-spacing: .22em;
    text-transform: uppercase; color: var(--honey); text-indent: .22em;
  }
  #bar { width: min(320px, 60vw); height: 2px; background: rgba(246,233,207,.16); overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; background: var(--honey); transition: width .3s ease; }
  #hint { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .55; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>
<div id="loading">
  <h1>Hollowtree</h1>
  <div id="bar"><i></i></div>
  <div id="hint">click to fly</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

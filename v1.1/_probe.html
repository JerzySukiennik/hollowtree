<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%}
#s{position:fixed;top:0;left:0;font:12px monospace;color:#fff;background:#0009;padding:6px;white-space:pre;z-index:5}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body><canvas id="app"></canvas><div id="s">boot</div>
<script type="module">
import * as THREE from 'three';
import { createSky } from './src/world/sky.js';
import { createTerrain } from './src/world/terrain.js';
import { createGrass } from './src/world/grass.js';
import { CAMERA } from './src/config.js';

const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
const VW = 1280, VH = 720;
renderer.setPixelRatio(1);
renderer.setSize(VW, VH, false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CAMERA.fov, VW/VH, CAMERA.near, CAMERA.far);

const sky = createSky(scene, renderer);
const terrain = createTerrain(scene);
const grass = createGrass(scene, terrain);

const probeMat = new THREE.MeshLambertMaterial({ color: 0xc8a25a });
const probeMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 3), probeMat);
probeMesh.castShadow = true; probeMesh.receiveShadow = true;
scene.add(probeMesh);
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1.6, 20, 14), probeMat);
sphere.castShadow = true; scene.add(sphere);

const p = new THREE.Vector3(0, 0, 0);
let t = 0, frames = 0, acc = 0, last = performance.now();
const s = document.getElementById('s');
window.__probe = { ok: true, err: null, fps: 0, calls: 0, tris: 0 };
window.addEventListener('error', e => { window.__probe.ok = false; window.__probe.err = String(e.message); });

function frame(now) {
  const dt = 1 / 60; last = now; t += dt;
  p.x = Math.sin(t * 0.25) * 45; p.z = Math.cos(t * 0.25) * 45;
  p.y = terrain.getHeight(p.x, p.z) + 3.2;
  grass.update(dt, p);
  sky.update(dt, 0.58, p);
  probeMesh.position.set(p.x + 14, terrain.getHeight(p.x + 14, p.z + 6) + 3, p.z + 6);
  sphere.position.set(p.x + 8, terrain.getHeight(p.x + 8, p.z + 14) + 1.6, p.z + 14);
  camera.position.set(p.x - Math.sin(t*0.25)*7, p.y + 2.2, p.z - Math.cos(t*0.25)*7);
  camera.lookAt(p.x + Math.sin(t*0.25)*20, p.y - 1.2, p.z + Math.cos(t*0.25)*20);
  renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc > 0.5) {
    const info = renderer.info.render;
    window.__probe.fps = Math.round(frames/acc);
    window.__probe.calls = info.calls;
    window.__probe.tris = info.triangles;
    s.textContent = `fps ${window.__probe.fps}  calls ${info.calls}  tris ${info.triangles}`;
    frames = 0; acc = 0;
  }
}
window.step = (n) => { for (let i = 0; i < (n || 1); i++) frame(performance.now()); };
window.bench = (n) => {
  window.step(5);
  const a = performance.now();
  window.step(n);
  const ms = (performance.now() - a) / n;
  const info = renderer.info.render;
  return { msPerFrame: +ms.toFixed(2), calls: info.calls, tris: info.triangles, programs: renderer.info.programs.length };
};
window.__g = grass; window.__t = terrain; window.__p = p; window.__scene = scene; window.__cam = camera; window.__renderer = renderer; window.__THREE = THREE;
window.count = (r) => { const a = grass.grass.instanceMatrix.array; let n = 0, vis = 0; for (let i = 0; i < grass.grass.count; i++) { const o = i*16; const dx = a[o+12]-p.x, dz = a[o+14]-p.z; if (Math.hypot(dx,dz) < r) { n++; if (a[o+5] > 0.001) vis++; } } return { inR: n, visible: vis, perM2: +(vis/(Math.PI*r*r)).toFixed(2) }; };
window.step(2);
setInterval(() => window.step(1), 33);
</script></body></html>
